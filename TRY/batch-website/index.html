<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Hub</title>
  <meta name="description" content="Previous solves, questions, notes and suggestions for our batch.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container header-inner">

      <!-- Logo: put your logo at images/logo.png (if missing, "LOGO" text shows) -->
      
      <div class="site-title" id="siteTitle">Piaju Study Hub</div>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>

      <nav class="main-nav" id="mainNav" aria-label="Main navigation">
        <a href="#/" data-route="home">Home</a>
        <a href="#/about" data-route="about">About</a>
        <a href="#/contact" data-route="contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- ===== PAGE CONTENT (filled by js/app.js) ===== -->
  <main id="app" class="container" tabindex="-1"></main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="container" id="footerText"></div>
  </footer>

  <noscript>
    <p style="padding:1rem;text-align:center">Please enable JavaScript to use this website.</p>
  </noscript>

  <!-- Order matters: data first, then app logic -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
