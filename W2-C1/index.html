<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar and Table</title>
</head>

<body>
    <header>
        <h1>Navigation and Table Example</h1>
        <nav>
            <ul>
                <li><a href="#table">Table</a></li>
                <li><a href="#form">Form</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="table">
            <h2>Section 1</h2>
            <table border="1px" style="border-collapse: collapse;">
                <caption>Sample Table</caption>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>GPA</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>C253011</td>
                        <td>Imam Samir Ali</td>
                        <td>3.7</td>
                    </tr>
                    <tr>
                        <td>C253010</td>
                        <td>Sakif Anam</td>
                        <td>3.9</td>
                    </tr>
                    <tr>
                        <td>C253019</td>
                        <td>Iftee Abir</td>
                        <td>3.2</td>
                    </tr>
                </tbody>
            </table>
        </section>
        <section id="form">
            <h2>Form</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>
                <input type="submit" value="Submit">
            </form>
        </section>
    </main>
</body>

</html>
